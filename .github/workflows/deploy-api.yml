# Builds the Go API as a static linux/arm64 binary and deploys it to the VPS (Oracle Cloud, Ubuntu, aarch64).
#
# On the VPS (one-time setup: infra/vps/setup.sh, docs/DEPLOY.md step 3):
#   /opt/binarysust-api/releases/<sha>/server   one directory per deploy, last 5 kept
#   /opt/binarysust-api/current                 symlink to the live release
#   /etc/binarysust-api.env                      production env (secrets live only here, never in CI)
#   binarysust-api.service                       systemd, `server serve --migrate` on 127.0.0.1:8081
#   cloudflared                                  Cloudflare Tunnel: api.binarysust.org -> localhost:8081
#
# Visitors never call the VPS directly: binarysust.org/api/* is the Pages Function proxy, whose
# API_ORIGIN is https://api.binarysust.org (the tunnel).
#
# A failed health check rolls back to the previous release. To redeploy an older commit, re-run its workflow run.
#
# Secrets (repo settings → Secrets and variables → Actions):
#   VPS_HOST         the VPS address
#   VPS_USER         SSH user with passwordless sudo for `systemctl restart binarysust-api`
#   VPS_SSH_KEY      that user's private key
#   VPS_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <host>` output, so the host key is pinned
name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - go.work
      - infra/vps/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time and never cancel each other mid-restart.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  APP_DIR: /opt/binarysust-api
  SERVICE: binarysust-api
  LOCAL_HEALTH_URL: http://127.0.0.1:8081/healthz
  PUBLIC_HEALTH_URL: https://api.binarysust.org/healthz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://binarysust.org
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test
        working-directory: apps/api
        run: go test ./...

      - name: Build (linux/arm64, static)
        working-directory: apps/api
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/server" ./cmd/server

      - name: SSH setup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for v in VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST VPS_USER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (see docs/DEPLOY.md step 3)"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

      - name: Upload release
        run: |
          release="$APP_DIR/releases/$GITHUB_SHA"
          ssh vps "mkdir -p '$release'"
          scp -q "$RUNNER_TEMP/server" "vps:$release/server.tmp"
          ssh vps "chmod 755 '$release/server.tmp' && mv -f '$release/server.tmp' '$release/server'"

      - name: Switch, restart, health check (rolls back on failure)
        run: |
          ssh vps "APP_DIR='$APP_DIR' SERVICE='$SERVICE' SHA='$GITHUB_SHA' HEALTH='$LOCAL_HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          previous=$(readlink current 2>/dev/null || true)

          switch_to() { ln -sfn "$1" current.new && mv -Tf current.new current; }
          healthy() {
            for _ in $(seq 1 60); do
              curl -fsS --max-time 2 "$HEALTH" >/dev/null 2>&1 && return 0
              sleep 1
            done
            return 1
          }

          switch_to "releases/$SHA"
          sudo -n systemctl restart "$SERVICE"
          if healthy; then
            echo "Live: $SHA"
          else
            echo "::error::$SERVICE did not become healthy on $SHA. Recent logs:"
            sudo -n journalctl -u "$SERVICE" -n 60 --no-pager || true
            if [ -n "$previous" ] && [ "$previous" != "releases/$SHA" ]; then
              echo "Rolling back to $previous"
              switch_to "$previous"
              sudo -n systemctl restart "$SERVICE"
              healthy && echo "Rolled back to $previous" || echo "::error::Rollback is not healthy either"
            fi
            exit 1
          fi

          # Keep the 5 newest releases (and whatever is live).
          live=$(readlink current)
          ls -1dt releases/*/ | sed 's#/$##' | tail -n +6 | while read -r old; do
            [ "$old" = "$live" ] || rm -rf -- "$old"
          done
          REMOTE

      - name: Public health check (through Cloudflare Tunnel)
        run: |
          if curl -fsS --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_HEALTH_URL"; then
            echo
          else
            echo "::warning::$PUBLIC_HEALTH_URL is not answering. The API is up on the VPS; check cloudflared and the tunnel's public hostname."
          fi

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
