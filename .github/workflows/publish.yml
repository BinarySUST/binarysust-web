# Builds the public site from the snapshot the API stored in Workers KV and deploys it to Cloudflare Pages.
# CI never touches the database: the API builds the snapshot (internal/republish.Publisher), stores it
# under snapshot:<hash>, points "latest" at it, then fires this workflow with the hash.
#
# Triggers:
#   - repository_dispatch "publish": the API, after content changed (a write, its nightly 00:05 Asia/Dhaka
#     date rollover, its boot after a deploy, or "republish now"); client_payload.hash names the snapshot
#   - push to main touching apps/web or packages/: code changes always deploy, with the latest snapshot
#   - manual run: the latest snapshot
#
# Secrets (repo settings → Secrets and variables → Actions):
#   SNAPSHOT_KV_NAMESPACE_ID  the Workers KV namespace the API writes (optional: without it the fixture is
#                             built and nothing is deployed)
#   SNAPSHOT_KV_READ_TOKEN    token with "Workers KV Storage: Read"
#   CLOUDFLARE_API_TOKEN      token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
name: publish

on:
  repository_dispatch:
    types: [publish]
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

# Bursts of edits collapse to one running build plus one pending; the pending one sees all edits.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE_URL: https://www.binarysust.org # canonical; binarysust.org 301s here (Cloudflare redirect rule)
  PAGES_PROJECT: binarysust

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the snapshot
        id: snapshot
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE: ${{ secrets.SNAPSHOT_KV_NAMESPACE_ID }}
          TOKEN: ${{ secrets.SNAPSHOT_KV_READ_TOKEN }}
          WANT: ${{ github.event.client_payload.hash }}
        run: |
          if [ -z "$NAMESPACE" ] || [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::SNAPSHOT_KV_* is not set; building the committed fixture, which is never deployed."
            echo "hash=fixture" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kv="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/storage/kv/namespaces/$NAMESPACE/values"
          get() { curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$kv/$1"; }
          mkdir -p apps/web/.snapshot
          out=apps/web/.snapshot/site.json
          # Workers KV is eventually consistent: a key the API just wrote can take up to a minute to be
          # readable here, so retry until the snapshot with the wanted hash arrives.
          for delay in 0 5 10 20 30 60; do
            sleep "$delay"
            hash="$WANT"
            [ -n "$hash" ] || hash=$(get latest | jq -r '.hash // empty') || true
            if [ -n "$hash" ] && get "snapshot%3A$hash" > "$out" && [ "$(jq -r .version.hash "$out")" = "$hash" ]; then
              echo "snapshot $hash"
              echo "hash=$hash" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "snapshot ${hash:-latest} not readable yet"
          done
          echo "::error::could not read snapshot ${WANT:-latest} from Workers KV"
          exit 1

      - name: Skip if the live site already has this content
        id: live
        # "Republish now" (client_payload.force) deploys even when the live site already has this hash.
        if: github.event_name != 'push' && github.event_name != 'workflow_dispatch' && github.event.client_payload.force != 'true'
        run: |
          live=$(curl -fsS --max-time 10 "$SITE_URL/version.json" | jq -r .hash || echo none)
          echo "live hash: $live, new hash: ${{ steps.snapshot.outputs.hash }}"
          if [ "$live" = "${{ steps.snapshot.outputs.hash }}" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.live.outputs.unchanged != 'true'
      - uses: actions/setup-node@v7
        if: steps.live.outputs.unchanged != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build
        if: steps.live.outputs.unchanged != 'true'
        env:
          TURBO_TELEMETRY_DISABLED: 1
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@binarysust/web

      - name: Deploy to Cloudflare Pages
        if: steps.live.outputs.unchanged != 'true' && steps.snapshot.outputs.hash != 'fixture'
        working-directory: apps/web
        env:
          WRANGLER_SEND_METRICS: false
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; built but not deployed."
            exit 0
          fi
          # First run only: create the Pages project (fails harmlessly when it exists; a real auth problem
          # surfaces in the deploy below).
          pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch main >/dev/null 2>&1 || true
          pnpm exec wrangler pages deploy dist/client --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
