# Quality gates (docs/adr/0001-monorepo-structure.md, rule 7). Every task runs through Turborepo, so Go and
# TypeScript share one task graph and one cache (.turbo, kept between runs with actions/cache). Pull requests run
# only the packages their changes affect (--affected against the PR base); pushes to main run everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  WRANGLER_SEND_METRICS: false

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  checks:
    name: format, lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: binary
          POSTGRES_PASSWORD: binary
          POSTGRES_DB: binarysust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U binary -d binarysust"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EKMAN_TEST_DATABASE_URL: postgres://binary:binary@localhost:5432/binarysust?sslmode=disable
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --affected compares with the PR base
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Generated code matches the Go API (openapi.json, api-client types)
        run: |
          pnpm gen
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts \
            || (echo "::error::Run 'pnpm gen' and commit apps/api/openapi.json and packages/api-client/src/schema.d.ts" && exit 1)

      - name: Lint (ESLint, golangci-lint), typecheck, unit tests (Vitest, go test -race), build
        run: pnpm turbo run lint typecheck test build $AFFECTED

      - name: Playwright browsers
        id: playwright
        run: |
          echo "version=$(pnpm --filter @binarysust/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @binarysust/web exec playwright install --with-deps chromium

      - name: E2E smoke tests (static build, mocked API)
        run: pnpm turbo run test:e2e $AFFECTED
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
