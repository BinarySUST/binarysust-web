# Local dev services, shaped like production (see dev/Caddyfile). Open http://binarysust.localhost.
# The Go API and the web dev server run on the host (fast reloads);
# Docker provides Postgres and the Caddy edge. Start with `make dev`.
name: binarysust

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: binary
      POSTGRES_PASSWORD: binary
      POSTGRES_DB: binarysust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binary -d binarysust"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    environment:
      API_UPSTREAM: host.docker.internal:${API_PORT:-8080}
      WEB_UPSTREAM: host.docker.internal:${WEB_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop already has it
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.data/media:/srv/media:ro

volumes:
  db:
