# Local dev services, shaped like production (see infra/caddy/Caddyfile). Open http://binarysust.localhost.
# The Go API and the web dev server run on the host (fast reloads);
# Docker provides Postgres and the Caddy edge. Start with `pnpm dev` at the repository root.
# The project name stays `binarysust` so the existing `binarysust_db` volume (and its data) is reused.
# Relative paths below resolve from this file's directory (infra/docker).
name: binarysust

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: binary
      POSTGRES_PASSWORD: binary
      POSTGRES_DB: binarysust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binary -d binarysust"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop already has it
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../.data/media:/srv/media:ro

volumes:
  db:
