name: Bug report
description: Something on the site, the dashboard or the API does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems go to binary.sust@gmail.com, not here (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://binarysust.org/events/...
        2. Click "Reserve a seat"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Public site, Dashboard, Sign-in, API, Build or deploy, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, request IDs or logs
      description: Error boxes in the dashboard show a request ID; paste it here.
