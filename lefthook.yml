# Git hooks (https://lefthook.dev), installed by `pnpm install` (the root `prepare` script).
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml,css,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "{apps,packages}/**/*.{js,mjs,ts,tsx}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
